<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login | BDNS</title>
<link rel="stylesheet" href="/shared.css" />
</head>
<body class="public-mode auth-standalone">

<div class="toast-area" id="toastArea"></div>

<section id="login" class="page active">
  <div class="auth-split-page standalone">

    <div class="auth-split-left">
      <div class="split-orbit o1"></div>
      <div class="split-orbit o2"></div>

      <div class="split-brand">
        <img src="/logo.png" alt="BDNS Logo">
        BDNS
      </div>

      <div class="split-illustration">
        <svg viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
          <circle cx="160" cy="160" r="118" fill="rgba(255,255,255,0.06)"/>
          <circle cx="160" cy="160" r="86" fill="rgba(255,255,255,0.08)"/>
          <g stroke="rgba(255,255,255,0.35)" stroke-width="1.5" fill="none">
            <line x1="160" y1="42" x2="160" y2="80"/>
            <line x1="278" y1="160" x2="240" y2="160"/>
            <line x1="160" y1="278" x2="160" y2="240"/>
            <line x1="42" y1="160" x2="80" y2="160"/>
            <line x1="97" y1="97" x2="122" y2="122"/>
            <line x1="223" y1="97" x2="198" y2="122"/>
            <line x1="223" y1="223" x2="198" y2="198"/>
            <line x1="97" y1="223" x2="122" y2="198"/>
          </g>
          <circle cx="160" cy="42" r="6" fill="#fbbf24"/>
          <circle cx="278" cy="160" r="6" fill="#fbbf24"/>
          <circle cx="160" cy="278" r="6" fill="#fbbf24"/>
          <circle cx="42" cy="160" r="6" fill="#fbbf24"/>
          <circle cx="97" cy="97" r="5" fill="#ffffff" opacity="0.8"/>
          <circle cx="223" cy="97" r="5" fill="#ffffff" opacity="0.8"/>
          <circle cx="223" cy="223" r="5" fill="#ffffff" opacity="0.8"/>
          <circle cx="97" cy="223" r="5" fill="#ffffff" opacity="0.8"/>
          <rect x="122" y="118" width="76" height="84" rx="12" fill="#ffffff"/>
          <rect x="138" y="140" width="44" height="34" rx="6" fill="#5b21b6"/>
          <path d="M148 140 v-10 a12 12 0 0 1 24 0 v10" fill="none" stroke="#5b21b6" stroke-width="6" stroke-linecap="round"/>
          <circle cx="160" cy="155" r="5" fill="#ffffff"/>
          <rect x="157" y="158" width="6" height="10" rx="3" fill="#ffffff"/>
        </svg>
      </div>

      <div class="split-tagline">
        <h3>Welcome back.</h3>
        <p>Access your secure blockchain DNS account and manage your domains.</p>
      </div>
    </div>

    <div class="auth-split-right">
      <div class="auth-split-form-wrap">
        <div class="auth-form-theme">

          <div class="split-form-header">
            <h2>Login</h2>
            <div class="split-underline"></div>
          </div>

          <label>Email</label>
          <input id="loginEmail" type="email" placeholder="Please enter your email">

          <label>Password</label>
          <div class="password-field">
            <input id="loginPassword" type="password" placeholder="Please enter your password">
            <span class="toggle-password" onclick="togglePassword('loginPassword', this)"></span>
          </div>

          <label>Login As</label>
          <select id="loginRole">
            <option value="customer">Customer</option>
            <option value="admin">Admin</option>
          </select>

          <button id="loginBtn" class="primary auth-full-btn-light role-customer" onclick="demoLogin()">Login →</button>

          <div class="auth-switch-light">
            Don't have an account?
            <span onclick="navigateTo('registerUser')">Register</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</section>

<script src="/shared.js"></script>
<script>initPage('login');</script>
</body>
</html>
