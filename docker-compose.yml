services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: bdns-backend

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"
      - "5500:5500"

    volumes:
      - ledger_data:/app/backend/data
      - ./frontend:/app/frontend
      - ./backend/app:/app/backend/app

    command: sh -c "python /app/frontend/serve_frontend.py & uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: bdns-redis

    ports:
      - "6379:6379"

volumes:
  ledger_data: