[project]
name = "bdns-backend"
version = "0.1.0"
description = "Blockchain-backed DNS MVP backend service"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "pydantic-settings>=2.10.0",
  "cryptography>=42.0.0",
  "dnspython>=2.6.1",
  "ecdsa>=0.19.0",
  "supabase>=2.5.0",
  "bcrypt>=4.1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.28.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.setuptools.packages.find]
include = ["app*", "ecdsa*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"